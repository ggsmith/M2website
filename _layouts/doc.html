<nav class="headline-wrapper flex flex-col gap-3 bg-[#eee] px-4 py-2 md:grid md:grid-cols-[minmax(0,4fr)_minmax(14rem,1fr)] md:items-center">

    <span id="headline">{{ page.title }}</span>
  </span>

  <form class="search w-full" id="x-search" role="search" action="{{ site.baseurl }}/search/">

  </form>
</nav>

<div class="main-wrapper">
  <main class="main-content" id="main">
    <article class="main-page-content" id="content">

  </main>
</div>
