<head>
  <!-- Basic meta elements -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Canonical link to help search engines -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="{{ site.baseurl }}/static/favicon.ico"
  />
  <link
    rel="alternate"
    type="application/rss+xml"
    title="RSS"
    href="{{ site.baseurl }}/atom.xml"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet"
  />
  <script>
    document.documentElement.classList.toggle(
      "dark",
      localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches),
    );
  </script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-warning: var(--warning);
      --color-warning-foreground: var(--warning-foreground);
      --color-success: var(--success);
      --color-success-foreground: var(--success-foreground);
      --color-destructive: var(--destructive);
      --color-destructive-foreground: var(--destructive-foreground);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --color-link: var(--link);
      --color-app-bg: var(--app-bg);
      --color-app-surface: var(--app-surface);
      --color-app-surface-muted: var(--app-surface-muted);
      --color-app-border: var(--app-border);
      --color-app-text: var(--app-text);
      --color-app-text-muted: var(--app-text-muted);
      --color-app-link: var(--app-link);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{{ site.baseurl }}/scripts/responsive-sidebar.js"></script>
  <link rel="stylesheet" href="{{ site.baseurl }}/static/theme.css" />
  <link rel="stylesheet" href="{{ site.baseurl }}/static/style.css" />
  <link rel="stylesheet" href="{{ site.baseurl }}/static/sidebar.css" />

  <title>
    {% if page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }}{%
    endif %}
  </title>

  {%- if page.layout == "post" %}
  <!-- Dublin Core metadata for Zotero -->
  <meta name="DC.title" content="{{ page.title }}" />
  <meta name="DC.creator" content="{{ page.author }}" />
  <meta name="DC.date" content="{{ page.publication-date }}" />
  <meta name="DC.source" content="{{ site.title }}" />
  <!-- Open Graph metadata -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:article:author" content="{{ page.author }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta
    property="og:url"
    content="{{ site.url }}{{ site.baseurl }}{{ page.url }}"
  />
  <meta
    property="og:image"
    content="{{ site.url }}{{ site.baseurl }}/static/open-graph-logo.png"
  />
  <meta property="og:image:width" content="200" />
  <meta property="og:image:height" content="200" />
  {%- endif %}

  <!-- KaTeX -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css"
    integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRcsAmDnRem7ESsYwWwg3m/OaJ2l4x7YBZl9Kxxib"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"
    integrity="sha384-Rma6DA2IPUwhNxmrB/7S3Tno0YY7sFu9WSYMCuulLhIqYSGZ2gKCJWIqhBWqMQfh"
    crossorigin="anonymous"
  ></script>
  <!-- KaTeX auto-render extention: https://katex.org/docs/autorender.html -->
  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
    integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
    crossorigin="anonymous"
  ></script>
  <!-- KaTeX copy-tex extention: https://github.com/KaTeX/KaTeX/tree/main/contrib/copy-tex -->
  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/copy-tex.min.js"
    integrity="sha384-HORx6nWi8j5/mYA+y57/9/CZc5z8HnEw4WUZWy5yOn9ToKBv1l58vJaufFAn9Zzi"
    crossorigin="anonymous"
  ></script>
  <script>
    var macros = {
        "\\PP": "\\mathbb{P}",
        "\\AA": "\\mathbb{A}",
        "\\NN": "\\mathbb{N}",
        "\\ZZ": "\\mathbb{Z}",
        "\\kk": "\\mathbb{k}",
        "\\QQ": "\\mathbb{Q}",
        "\\RR": "\\mathbb{R}",
        "\\CC": "\\mathbb{C}",
      },
      ignoredTags = [
        "kbd",
        "var",
        "samp",
        "script",
        "noscript",
        "style",
        "textarea",
        "pre",
        "code",
        "option",
      ],
      delimiters = [{ left: "$", right: "$", display: false }];

    function renderKaTeX() {
      renderMathInElement(document.body, { macros, ignoredTags });
      // KaTeX auto-renders $$..$$, \\(..\\), \\[..\\], and equation, align, gather, and CD envs, but not $..$!
      renderMathInElement(document.body, { macros, ignoredTags, delimiters });
    }

    document.addEventListener("DOMContentLoaded", renderKaTeX);
  </script>

  <!-- Prism -->
  <link
    href="{{ site.baseurl }}/static/prism.css"
    rel="stylesheet"
    type="text/css"
  />
  <script src="{{ site.baseurl }}/static/prism-macaulay2.js"></script>
  <style>
    :root:not(.dark) pre[class*="language-"],
    :root:not(.dark) code[class*="language-"] {
      background-color: #d8ffff !important;
    }
  </style>

  <!-- Handlebars -->
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>

  <!-- jQuery -->
  <script
    src="https://cdn.jsdelivr.net/npm/jquery@3.7/dist/jquery.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"
  ></script>

  <!-- Anchor -->
  <script src="https://cdn.jsdelivr.net/npm/anchor-js/anchor.min.js"></script>

  <!-- Fuse -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

  {%- if site.cf_beacon %}
  <!-- Cloudflare Web Analytics -->
  <script
    defer
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "{{ site.cf_beacon }}"}'
  ></script>
  <!-- End Cloudflare Web Analytics -->
  {%- endif %}
</head>
